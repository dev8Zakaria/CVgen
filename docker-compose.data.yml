services:
  postgres:
    image: postgres:16
    container_name: aicv-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aicv_db
      POSTGRES_USER: aicv_user
      POSTGRES_PASSWORD: aicv_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aicv-data-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: aicv-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://192.168.0.210
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: "edge"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - aicv-data-network

networks:
  aicv-data-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
