name: Backend CI Pipeline

# 1. Quand est-ce que ce pipeline s'exécute ?
on:
  push:
    branches: [ "main", "develop" ,"dev-assaad" ]
    # On lance le CI uniquement si des fichiers du dossier backend ont été modifiés
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main", "develop","dev-assaad" ]
    paths:
      - 'backend/**'

# 2. Que doit faire le pipeline ?
jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest # Le serveur virtuel utilisé par GitHub
    
    steps:
    # Étape A : Télécharger le code sur le serveur virtuel
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      
    # Étape B : Installer le SDK .NET 10
    - name: ⚙️ Configuration de .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    # Étape C : Télécharger les packages NuGet
    - name: 📦 Restauration des dépendances
      run: dotnet restore ./backend/AiCv.Backend.sln
      
    # Étape D : Compiler le code pour vérifier qu'il n'y a pas d'erreurs
    - name: 🛠️ Compilation (Build)
      run: dotnet build ./backend/AiCv.Backend.sln --configuration Release --no-restore

    # Étape E : Partager le backend déjà restauré et compilé avec le job de test
    - name: 📦 Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-build-workspace
        path: backend
        if-no-files-found: error

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build

    steps:
    # Étape A : Installer le SDK .NET 10
    - name: ⚙️ Configuration de .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Étape B : Récupérer le backend déjà restauré et compilé
    - name: 📥 Download backend artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-build-workspace
        path: .

    # Étape C : Exécuter les tests sans recompiler
    - name: 🧪 Tests (Run)
      run: dotnet test ./backend/AiCv.Backend.sln --configuration Release --no-build --verbosity normal
