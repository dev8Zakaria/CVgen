name: CI - BFF Gateway

on:
  push:
    branches: [ "main", "develop", "dev-assaad" ]
    paths:
      - 'services/bff-gateway/**'
      - '.github/workflows/ci-bff-gateway.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'services/bff-gateway/**'
      - '.github/workflows/ci-bff-gateway.yml'

jobs:
  build-and-test:
    name: Build and test BFF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore service
        working-directory: ./services/bff-gateway/src/AiCv.BffGateway
        run: dotnet restore

      - name: Build service
        working-directory: ./services/bff-gateway/src/AiCv.BffGateway
        run: dotnet build --no-restore --configuration Release

      - name: Run BFF tests
        working-directory: ./services/bff-gateway/tests/AiCv.BffGateway.Tests
        run: dotnet test --configuration Release --verbosity normal

      - name: Docker build check
        working-directory: ./services/bff-gateway
        run: docker build -f Dockerfile -t aicv-bff-gateway:test .
