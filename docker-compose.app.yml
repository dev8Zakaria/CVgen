services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicv-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://192.168.0.210/api
      VITE_KEYCLOAK_URL: http://192.168.0.210
      VITE_KEYCLOAK_REALM: ai-cv-generator
      VITE_KEYCLOAK_CLIENT_ID: frontend-client
    networks:
      - aicv-app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicv-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__DefaultConnection: Host=192.168.0.220;Port=5432;Database=aicv_db;Username=aicv_user;Password=aicv_password
      Keycloak__Authority: http://192.168.0.220:8080/realms/ai-cv-generator
      Keycloak__Audience: frontend-client
    networks:
      - aicv-app-network

  nginx:
    image: nginx:alpine
    container_name: aicv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aicv-app-network

networks:
  aicv-app-network:
    driver: bridge
