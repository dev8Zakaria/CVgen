services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicv-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-ai-cv-generator}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-frontend-client}
    depends_on:
      - backend
    networks:
      - aicv-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicv-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://0.0.0.0:5000}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicv_db};Username=${POSTGRES_USER:-aicv_user};Password=${POSTGRES_PASSWORD:-aicv_password}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/ai-cv-generator}
      Keycloak__Audience: ${KEYCLOAK_AUDIENCE:-frontend-client}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      Minio__Endpoint: ${MINIO_ENDPOINT:-minio:9000}
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - postgres
      - keycloak
    networks:
      - aicv-network
  
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aicv-ai-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - aicv-network

  postgres:
    image: postgres:16
    container_name: aicv-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicv_db}
      POSTGRES_USER: ${POSTGRES_USER:-aicv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicv_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aicv-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: aicv-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - aicv-network

  minio:
    image: minio/minio:latest
    container_name: aicv-minio
    ports:
      - "9000:9000" # Port de l'API
      - "9001:9001" # Port de la console Web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - aicv-network

networks:
  aicv-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  minio_data:
